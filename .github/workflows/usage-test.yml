name: Usage test (aceitacao ponta a ponta)

# The client's acceptance script, run as an executable gate:
#   install → open → Configurações → pasta de VST3 → Scan → Add input chain,
#   plus the "curso-musica" database on PostgreSQL 5432, the tuner on the
#   configured input device, and the module exercises.
#
# The Linux job proves the logic on every PR (JACK dummy gives a real audio
# device without hardware). The Windows job is the client's "clean Windows
# installation": a fresh windows-latest runner with its own PostgreSQL, which is
# where the .exe actually ships.

on:
  pull_request:
  push:
    branches: [test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: usage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-usage:
    name: Linux (logica ponta a ponta)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cursomusica
          POSTGRES_PASSWORD: cursomusica
          POSTGRES_DB: curso-musica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cursomusica -d curso-musica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (incl. JACK and GTK for the test plugin editor)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libglu1-mesa-dev \
            libjack-jackd2-dev jackd2 libgtk-3-dev libpq-dev

      - name: Clone JUCE (pinned)
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git External/JUCE

      - name: Configure (usage test on)
        run: cmake -B build-usage -G Ninja -DCMAKE_BUILD_TYPE=Release -DCURSOMUSICA_USAGE_TEST=ON

      - name: Build (app, test plugin and usage test)
        run: cmake --build build-usage

      - name: "Start JACK (dummy driver: a real audio device, no hardware)"
        run: |
          export JACK_NO_AUDIO_RESERVATION=1
          jackd -d dummy -r 48000 -p 512 >/tmp/jackd.log 2>&1 &
          sleep 5

      - name: Run usage test
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: cursomusica
          PGPASSWORD: cursomusica
          PGDATABASE: curso-musica
          CURSOMUSICA_PG_SCHEMA: curso-musica
          JACK_NO_AUDIO_RESERVATION: "1"
        run: |
          plugin_dir="$(mktemp -d)"
          cp -r "build-usage/CursoMusicaTestPlugin_artefacts/Release/VST3/CursoMusica Test Plugin.vst3" "$plugin_dir/"
          ./build-usage/CursoMusicaUsageTest_artefacts/Release/CursoMusicaUsageTest \
            --vst3-folder="$plugin_dir"

  windows-usage:
    name: Windows (instalacao limpa)
    # The client's clean Windows machine. Gated like the Windows build in
    # ci.yml: Windows minutes are limited (see AGENTS.md), so it runs on the
    # test/main branches and on demand, not on every PR or feature push.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/test' || github.ref == 'refs/heads/main'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start a throwaway PostgreSQL on 5432 (trust auth)
        shell: pwsh
        run: |
          # The runner image already ships a PostgreSQL, so installing another
          # one leaves its superuser password unknown — that is what failed with
          # "password authentication failed for user postgres". Instead, run a
          # real server from the binaries already on the image: initdb a fresh
          # cluster with trust auth on localhost (a throwaway CI database) and
          # create the role and database. No superuser password is involved, and
          # there is no 400 MB installer download.
          $bin = $env:PGBIN
          if (-not $bin -or -not (Test-Path (Join-Path $bin "initdb.exe"))) {
            $bin = (Get-ChildItem "C:\Program Files\PostgreSQL" -Directory |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName "bin" } |
              Where-Object { Test-Path (Join-Path $_ "initdb.exe") } |
              Select-Object -First 1)
          }
          if (-not $bin) { Write-Error "PostgreSQL server binaries not found"; exit 1 }
          echo $bin >> $env:GITHUB_PATH
          # The parent of bin\ is the PostgreSQL root CMake needs for libpq.
          # Forward slashes: they are valid on Windows and survive being written
          # into the generated staging script (backslashes would break its parser).
          $root = (Get-Item $bin).Parent.FullName -replace '\\', '/'
          echo "PGROOT=$root" >> $env:GITHUB_ENV

          $data = Join-Path $env:RUNNER_TEMP "pgdata"
          $log  = Join-Path $env:RUNNER_TEMP "postgres.log"
          & "$bin\initdb.exe" -D $data -U postgres --auth=trust --encoding=UTF8 --locale=C | Out-Null
          & "$bin\pg_ctl.exe" -D $data -o "-p 5432 -c listen_addresses=localhost" -l $log -w start
          & "$bin\psql.exe" -h localhost -p 5432 -U postgres -v ON_ERROR_STOP=1 `
            -c "CREATE ROLE cursomusica LOGIN PASSWORD 'cursomusica';"
          & "$bin\psql.exe" -h localhost -p 5432 -U postgres -v ON_ERROR_STOP=1 `
            -c 'CREATE DATABASE "curso-musica" OWNER cursomusica;'

      - name: Clone JUCE (pinned)
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git External/JUCE

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (usage test on)
        shell: pwsh
        # CURSOMUSICA_REQUIRE_POSTGRES makes the configure step fail if libpq is
        # missing, so the database step can never silently degrade to SKIP on the
        # platform where the .exe ships.
        run: >
          cmake -B build-usage -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCURSOMUSICA_USAGE_TEST=ON
          -DCURSOMUSICA_REQUIRE_POSTGRES=ON
          "-DPostgreSQL_ROOT=$env:PGROOT"

      - name: Build (app, test plugin and usage test)
        run: cmake --build build-usage

      - name: Run usage test
        shell: pwsh
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: cursomusica
          PGPASSWORD: cursomusica
          PGDATABASE: curso-musica
          CURSOMUSICA_PG_SCHEMA: curso-musica
        run: |
          $plugin = Get-ChildItem -Recurse -Directory -Filter "CursoMusica Test Plugin.vst3" build-usage |
            Select-Object -First 1
          if (-not $plugin) { Write-Error "Test plugin bundle not found"; exit 1 }
          $dir = Split-Path $plugin.FullName -Parent
          & "build-usage/CursoMusicaUsageTest_artefacts/Release/CursoMusicaUsageTest.exe" --vst3-folder="$dir"
          $code = $LASTEXITCODE
          Write-Host "CursoMusicaUsageTest exit code: $code"
          # The console output can be lost on an abnormal exit; the program also
          # writes every line to usage-test.log, so print it either way.
          if (Test-Path usage-test.log) { Get-Content usage-test.log }
          exit $code
