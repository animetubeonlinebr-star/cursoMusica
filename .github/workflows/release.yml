name: Release (Windows installer)

# REQ-013: for every new module, publish an installer on the test branch with
# unrestricted access (all modules unlocked), so a module can be reviewed
# without unlocking the previous ones.
# REQ-014: the Windows installer lets the user choose the install directory and
# leaves the app ready to use.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      module:
        description: "Module id for a test build (e.g. m3-ii-v-i)"
        required: false
        default: "test"
      unlock_all:
        description: "Build with all modules unlocked (test override)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build and package Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone JUCE (pinned)
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git External/JUCE

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DTEST_UNLOCK_ALL=${{ github.event.inputs.unlock_all }}

      - name: Build
        run: cmake --build build --config Release

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer (choose install directory)
        shell: pwsh
        run: |
          # The installer script must include the NSIS "Directory" page so the
          # user can choose where to install (REQ-014).
          makensis deploy/windows/installer.nsi

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CursoMusica-Setup-${{ github.event.inputs.module || github.ref_name }}
          path: deploy/windows/dist/*.exe

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/windows/dist/*.exe
