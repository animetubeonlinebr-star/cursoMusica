name: Release (Windows installer)

# REQ-013: for every new module, publish an installer on the test branch with
# unrestricted access (all modules unlocked), so a module can be reviewed
# without unlocking the previous ones.
# REQ-014: the Windows installer lets the user choose the install directory and
# leaves the app ready to use.
#
# This workflow is also the only way to produce the real Windows binary: the
# development machine is Linux, so the .exe is built here and then committed to
# instalador/ on the test branch.

on:
  push:
    branches: [test]
  workflow_dispatch:
    inputs:
      module:
        description: "Module id for a test build (e.g. 1)"
        required: false
        default: "1"
      unlock_all:
        description: "Build with all modules unlocked (test override)"
        type: boolean
        default: true
      commit_installer:
        description: "Commit the built installer to instalador/ on this branch"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build and package Windows installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Clone JUCE (pinned)
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git External/JUCE

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DTEST_UNLOCK_ALL=${{ github.event.inputs.unlock_all || 'true' }}

      - name: Build
        run: cmake --build build

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build installer (choose install directory)
        shell: pwsh
        run: |
          # choco updates the machine PATH, which this process does not see.
          $env:Path += ";C:\Program Files (x86)\NSIS"
          # NSIS resolves File/OutFile against the current directory on Windows,
          # so pass absolute paths. It also does not accept ".." in a path.
          $app = Join-Path $PWD "build/CursoMusica_artefacts/Release/Curso Musica Studio.exe"
          $out = Join-Path $PWD "instalador/Instalador CursoMusica.exe"
          if (-not (Test-Path $app)) {
            Write-Error "Application binary not found at $app"
            Get-ChildItem -Recurse -Filter *.exe build | Select-Object FullName
            exit 1
          }
          New-Item -ItemType Directory -Force -Path (Split-Path $out) | Out-Null
          $defines = @("-DAPPEXE=$app", "-DOUTFILE=$out")
          if (Test-Path "build/runtime") {
            $defines += "-DRUNTIME"
          }
          makensis @defines deploy/windows/installer.nsi
          Get-Item $out | Format-List Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-CursoMusica-${{ github.event.inputs.module || 'test' }}
          path: instalador/Instalador CursoMusica.exe

      - name: Commit installer to the test branch
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit_installer == 'true' }}
        shell: pwsh
        run: |
          git config user.name "openhands"
          git config user.email "openhands@all-hands.dev"
          git add -f "instalador/Instalador CursoMusica.exe"
          git commit -m "build(test): instalador CursoMusica com todos os modulos liberados (REQ-013)"
          git push

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: instalador/Instalador CursoMusica.exe
